<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Dr. Rahul Gaikwad - Blog | Cloud Architecture & DevOps Insights</title>
    <meta name="description" content="Personal blog of Dr. Rahul Gaikwad sharing insights on cloud architecture, DevOps, AI/ML, and technology. Explore technical tutorials and professional experiences.">
    <link rel="canonical" href="https://yourdomain.com/">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Dr. Rahul Gaikwad - Blog | Cloud Architecture & DevOps Insights">
    <meta property="og:description" content="Personal blog sharing insights on cloud architecture, DevOps, AI/ML, and technology. Explore technical tutorials and professional experiences.">
    <meta property="og:image" content="https://yourdomain.com/assets/images/social-thumbnail.jpg">
    <meta property="og:url" content="https://yourdomain.com/">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dr. Rahul Gaikwad - Blog | Cloud Architecture & DevOps Insights">
    <meta name="twitter:description" content="Personal blog sharing insights on cloud architecture, DevOps, AI/ML, and technology.">
    <meta name="twitter:image" content="https://yourdomain.com/assets/images/social-thumbnail.jpg">
    
    <!-- Google Analytics GA4 -->
    <!-- Replace GA_MEASUREMENT_ID with your actual GA4 Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID');
    </script>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" class="logo">DRG Blogs</a>
            </div>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html" class="nav-link">Blogs</a>
                    <a href="whoami.html" class="nav-link">$ whoami</a>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-background">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
        <div class="hero-container">
            <div class="hero-content">
                <h1 class="hero-title">Dr. Rahul Gaikwad — Building, Writing, Sharing</h1>
                <p class="hero-subtitle">Cloud Architecture • DevOps • AI • AIOps</p>
                <button class="cta-button" onclick="document.querySelector('.blog-list').scrollIntoView({behavior: 'smooth'})">Read latest blog</button>
            </div>
            <div class="hero-illustration">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="icon icon-cloud">☁</div>
                <div class="icon icon-code">⚡</div>
                <div class="icon icon-ai">🤖</div>
            </div>
        </div>
    </section>

    <!-- Blog List Section -->
    <section class="blog-list">
        <div class="blog-list-container">
            <h2 class="section-title">Recent Posts</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search posts by title or tags..." />
            </div>
            <div id="posts-container">
                <!-- Blog posts will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Content Area -->
    <main class="content">
        <div id="blog-content">
            <!-- Selected blog content will be displayed here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 · Dr. Rahul Gaikwad. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
